# The gate: every push and every pull request runs the whole suite, and a red run means do not merge.
#   sdk             the SDK, the playlist builder and the release checks (unittest, a made-up FF1 on 127.0.0.1,
#                   canned answers of the art sources)
#   home-assistant  the integration inside Home Assistant (pytest-homeassistant-custom-component)
# Nothing here reaches a real FF1.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "aiohttp>=3.9" "cryptography>=42"
      - run: python -m unittest discover -s tests -v

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The harness pins its own Home Assistant (0.13.375: 2026.10.4); bump it with the stack's Home Assistant.
      - run: pip install "pytest-homeassistant-custom-component==0.13.375"
      - run: python -m pytest -v
