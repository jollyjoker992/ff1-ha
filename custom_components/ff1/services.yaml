show_playlist:
  target:
    entity:
      integration: ff1
      domain: media_player
  fields:
    request:
      required: true
      selector:
        object:
rotate:
  target:
    entity:
      integration: ff1
      domain: media_player
  fields:
    clockwise:
      default: true
      selector:
        boolean:
set_sleep_schedule:
  target:
    entity:
      integration: ff1
      domain: media_player
  fields:
    enabled:
      required: true
      selector:
        boolean:
    sleep_time:
      selector:
        text:
    wake_time:
      selector:
        text:
set_work_duration:
  target:
    entity:
      integration: ff1
      domain: media_player
  fields:
    seconds:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
set_framing:
  target:
    entity:
      integration: ff1
      domain: media_player
  fields:
    framing:
      required: true
      selector:
        select:
          options:
            - fit
            - fill
